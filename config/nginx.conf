server {
    listen 80;
    server_name _;                  # или можно было бы example.com, но пока все домены

    root /usr/share/nginx/html;
    index index.html;

    # чтобы SPA нормально работала при любом роуте
    location / {
        try_files $uri $uri/ /index.html;
    }

    # проксируем все запросы на /api/ к бэкенду
    location /api/ {
        proxy_pass https://task.tspb.su/test-task/;
        proxy_set_header Host task.tspb.su;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # иногда добавляют это, чтобы не было долгих таймаутов
        proxy_read_timeout 90;
        proxy_connect_timeout 90;
    }

    # статика с кэшем (js, css, картинки и шрифты)
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;           # обычно логи статики не нужны
        try_files $uri =404;
    }

    # если вдруг кто-то полезет за favicon или robots без расширения
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    # 404 и прочие ошибки можно потом красиво оформить, пока просто дефолт
}